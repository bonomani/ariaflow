name: release-tap

# Auto-publish the rendered formula into both brew tap repos
# (bonomani/homebrew-ariaflow-server and bonomani/homebrew-ariaflow).
# Runs in parallel with the release-formula workflow that attaches
# the .rb file to the release.
#
# Required repo secret:
#   TAP_PUSH_TOKEN — a fine-scoped PAT or GitHub App token with
#                    `contents: write` on both tap repos.
#
# If the secret is missing the job exits early with a clear message
# rather than failing the release pipeline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish into the tap (e.g. v0.1.205)"
        required: true
        type: string

env:
  TAP_OWNER: bonomani
  TAP_REPO: homebrew-ariaflow-server
  FORMULA_PATH: Formula/ariaflow-server.rb

jobs:
  publish-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secret
        id: secret
        run: |
          if [ -z "${{ secrets.TAP_PUSH_TOKEN }}" ]; then
            echo "TAP_PUSH_TOKEN not set — skipping tap publish (run release-formula's asset upload manually if needed)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.secret.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.available == 'true'
        with:
          node-version: "20"
          cache: pnpm

      - name: Install + build (host repo)
        if: steps.secret.outputs.available == 'true'
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build

      - name: Render formula
        if: steps.secret.outputs.available == 'true'
        run: |
          mkdir -p dist-formula
          node packages/cli/dist/index.js formula \
            --tag "${{ steps.tag.outputs.value }}" \
            --output "dist-formula/ariaflow-server.rb"

      - name: Push to tap repos
        if: steps.secret.outputs.available == 'true'
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          for REPO in homebrew-ariaflow-server homebrew-ariaflow; do
            echo "--- Updating ${{ env.TAP_OWNER }}/${REPO} ---"
            rm -rf tap-repo
            git clone --depth 1 \
              "https://x-access-token:${{ secrets.TAP_PUSH_TOKEN }}@github.com/${{ env.TAP_OWNER }}/${REPO}.git" \
              tap-repo
            mkdir -p "tap-repo/$(dirname ${{ env.FORMULA_PATH }})"
            cp dist-formula/ariaflow-server.rb "tap-repo/${{ env.FORMULA_PATH }}"
            cd tap-repo
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git diff --quiet -- "${{ env.FORMULA_PATH }}"; then
              echo "no formula changes in ${REPO} — skipping"
              cd ..
              continue
            fi
            git add "${{ env.FORMULA_PATH }}"
            git commit -m "Bump ariaflow-server to ${TAG}"
            git push
            cd ..
          done
