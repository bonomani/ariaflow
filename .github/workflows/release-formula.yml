name: release-formula

# Render the Homebrew formula on every release tag and attach it as
# a release asset. The brew tap repo can pull this asset (or a
# release workflow there can mirror it) without needing local
# Node/pnpm tooling.
#
# Triggers:
#   - push of a `v*` tag (the canonical release path)
#   - manual dispatch (for backfilling missing assets)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to render the formula for (e.g. v0.1.205)"
        required: true
        type: string

jobs:
  render-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # BG-67: Sigstore keyless OIDC
      attestations: write   # BG-67: GitHub provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render formula
        run: |
          mkdir -p dist-formula
          node packages/cli/dist/index.js formula \
            --tag "${{ steps.tag.outputs.value }}" \
            --output "dist-formula/ariaflow-server.rb"
          echo "--- rendered ariaflow-server.rb ---"
          head -30 dist-formula/ariaflow-server.rb

      - name: Smoke-check the rendered formula has expected sections
        run: |
          test -s dist-formula/ariaflow-server.rb
          grep -q "class AriaflowServer < Formula" dist-formula/ariaflow-server.rb
          grep -q 'depends_on "node"' dist-formula/ariaflow-server.rb
          grep -q 'depends_on "aria2"' dist-formula/ariaflow-server.rb
          grep -q "service do" dist-formula/ariaflow-server.rb

      # BG-67: Sigstore keyless signature on the rendered formula so a
      # client (or future ariaflow auto-update verifier) can confirm
      # the artifact came from this repo's CI without needing a
      # long-lived signing key.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign formula (Sigstore)
        if: github.event_name == 'push'
        run: |
          cosign sign-blob --yes \
            --output-signature="dist-formula/ariaflow-server.rb.sig" \
            --output-certificate="dist-formula/ariaflow-server.rb.pem" \
            dist-formula/ariaflow-server.rb

      - name: Generate provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-formula/ariaflow-server.rb

      - name: Upload as release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-formula/ariaflow-server.rb
            dist-formula/ariaflow-server.rb.sig
            dist-formula/ariaflow-server.rb.pem
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact (for manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: ariaflow-server-formula
          path: dist-formula/ariaflow-server.rb
