name: release-npm

# Publish @ariaflow/{core,api,cli} to npm on every `v*` tag push.
#
# Required repo secret:
#   NPM_TOKEN — automation token with publish access to the @ariaflow scope.
#
# Behavior:
#   1. Skip cleanly when NPM_TOKEN is missing (logged, not errored).
#   2. Set the version field of each workspace package to the tag's
#      semver (vX.Y.Z -> X.Y.Z).
#   3. Run `pnpm -r build`.
#   4. Run `pnpm -r --filter "@ariaflow/*" publish --no-git-checks
#      --access public`. pnpm replaces `workspace:*` deps with the
#      concrete version automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.205)"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip the leading v
        id: ver
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid semver from tag: $TAG"
            exit 1
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Set workspace versions
        run: |
          VER="${{ steps.ver.outputs.value }}"
          for pkg in packages/core packages/api packages/cli; do
            node -e "
              const fs=require('fs');
              const p='$pkg/package.json';
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              j.version='$VER';
              fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
            "
          done

      - name: Install + build + test
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build
          pnpm test

      - name: Pack the workspace and smoke-install in a fresh dir
        run: |
          set -euxo pipefail
          # pnpm 9 doesn't support `--filter` on pack; run it once per
          # workspace package. Tarballs go to $RUNNER_TEMP so the next
          # step can install them offline by path.
          for pkg in packages/core packages/api packages/cli; do
            (cd "$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP")
          done
          ls "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/sandbox"
          cd "$RUNNER_TEMP/sandbox"
          npm init -y > /dev/null
          npm install \
            "$RUNNER_TEMP/ariaflow-core-${{ steps.ver.outputs.value }}.tgz" \
            "$RUNNER_TEMP/ariaflow-api-${{ steps.ver.outputs.value }}.tgz" \
            "$RUNNER_TEMP/ariaflow-cli-${{ steps.ver.outputs.value }}.tgz"
          ./node_modules/.bin/ariaflow --version
          # Doctor exits 1 (no aria2 in CI) but the step is just a
          # smoke-test that the bin loads; swallow the exit to stay green.
          ./node_modules/.bin/ariaflow doctor || true

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secret
        id: secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.secret.outputs.available == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.available == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Strip the leading v
        if: steps.secret.outputs.available == 'true'
        id: ver
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid semver from tag: $TAG"
            exit 1
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: Set workspace versions
        if: steps.secret.outputs.available == 'true'
        run: |
          VER="${{ steps.ver.outputs.value }}"
          for pkg in packages/core packages/api packages/cli; do
            node -e "
              const fs=require('fs');
              const p='$pkg/package.json';
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              j.version='$VER';
              fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
              console.log(p, '->', '$VER');
            "
          done

      - name: Install + build
        if: steps.secret.outputs.available == 'true'
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build

      - name: Publish
        if: steps.secret.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # pnpm replaces workspace:* with the concrete version per its
          # publish docs (https://pnpm.io/cli/publish#publishing-monorepo).
          pnpm --filter "@ariaflow/*" publish --no-git-checks --access public
